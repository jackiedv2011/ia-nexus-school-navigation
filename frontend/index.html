<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/phoenix.png" />
    <!-- Home-screen icon. Without it iOS uses a screenshot of the page. Opaque
         and square on purpose: iOS rounds the corners itself and turns any
         transparency black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="IA Nexus" />
    <meta name="description" content="IA Nexus — school navigation assistant: teacher locations, room directions, and bell schedule for Independence Academy." />
    <title>IA Nexus</title>
    <meta name="theme-color" content="#B0252A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)" />
    <!-- Sets data-theme before the first paint so dark-mode users never see a
         white flash. Synchronous on purpose, and a real file rather than an
         inline script because this app's CSP is script-src 'self'. -->
    <script src="/theme-init.js"></script>
    <!-- Self-hosted webfonts. These previously came from fonts.googleapis.com,
         which put a third-party CDN on the critical path: a render-blocking
         stylesheet that never resolves means a blank page, and school networks
         filter CDNs more than most. See public/fonts/fonts.css. -->
    <link rel="preload" href="/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
